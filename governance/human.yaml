# HUMAN-ONLY (Constitution Art. 6). The Builder reads this file; it never writes it.
# After editing, run: loop/seal.sh

firm:
  # Hard monthly cap on LLM spend for ALL firm agents together (USD).
  # null = the firm's agents do not run. The Runtime refuses to provision keys or wake agents.
  monthly_llm_usd_cap: null
  max_concurrent_agents: 12      # agents awake at the same time
  max_agents_total: 200          # alive agents, all pods, all scales
  max_spawn_depth: 2             # worker → sub-worker → stop

builder:
  # Which model does the work. sonnet ≈ half the price of opus per token; opus for hard eras.
  model: sonnet                  # sonnet | opus | haiku
  effort: medium                 # low | medium | high | xhigh | max — lower = fewer, cheaper tokens
  subagent_model: sonnet         # auditor / red-team / helper agents (haiku = cheapest, weaker review)
  # One command (loop/builder.sh start) runs this many cycles, then stops.
  cycles_per_run: 4
  # Dollar guard rails (list-price USD as reported by Claude Code).
  # A cycle only starts if its whole max_usd_per_cycle still fits under the run and day caps,
  # so neither cap can ever be overshot.
  max_usd_per_cycle: 3           # a cycle is cut off at this spend
  max_usd_per_run: 12            # the most one `loop/builder.sh start` can spend (4 × $3)
  max_usd_per_day: 15            # the most all of today's runs together can spend
  max_cycles_per_day: 8
  max_turns_per_cycle: 120
  max_consecutive_failures: 3    # then one diagnosis cycle, then the loop stops for you
  cycle_sleep_seconds: 60        # pause between cycles inside one run
  git_remote: origin

approvals:
  era_gates: false               # true = Builder stops and waits at each Era boundary
  pitch_requires_human: true     # Era III: you approve pitches until you set this false

network:
  # The only hosts firm agents may reach (through the App / metered keys).
  firm_egress_allowlist:
    - openrouter.ai
    - api.anthropic.com
    - query1.finance.yahoo.com
    - query2.finance.yahoo.com
