# HUMAN-ONLY (Constitution Art. 6). The Builder reads this file; it never writes it.
# After editing, run: loop/seal.sh   (it also applies builder.team to the agent files)

firm:
  # Hard monthly cap on LLM spend for ALL firm agents together (USD).
  # null = the firm's agents do not run. The Runtime refuses to provision keys or wake agents.
  monthly_llm_usd_cap: null
  max_concurrent_agents: 12      # agents awake at the same time
  max_agents_total: 200          # alive agents, all pods, all scales
  max_spawn_depth: 2             # worker → sub-worker → stop

builder:
  # The Builder team — the ONLY place models are chosen. Judgment goes to opus, execution to
  # sonnet. model: opus | sonnet | haiku | fable (aliases follow the newest release) or a
  # full claude-* id. effort: low | medium | high | xhigh | max.
  team:
    lead:      {model: sonnet, effort: high}   # main session: orient, build, test, record
    lead_hard: {model: opus,   effort: high}   # lead for diagnosis, retrospective (every 10th) and the cycle after a failure
    architect: {model: opus,   effort: high}   # plans each unit before code is written (Gate 2)
    auditor:   {model: opus,   effort: high}   # reviews every diff before merge (Gate 5)
    red-team:  {model: opus,   effort: high}   # attacks physics after risky changes
    helpers:   {model: sonnet}                 # every other subagent: search, exploration, chores

  # One command (loop/builder.sh start) runs this many cycles, then stops.
  cycles_per_run: 4
  # Dollar guard rails (list-price USD as reported by Claude Code). A cycle only starts if its
  # whole max_usd_per_cycle still fits under the run and day caps, so no cap is ever overshot.
  # Measured on all-opus cycles: $1.2–4.8, $6–7.6 with a red-team pass.
  max_usd_per_cycle: 8           # a cycle is cut off at this spend (room for a red-team pass)
  max_usd_per_run: 30            # the most one `loop/builder.sh start` can spend
  max_usd_per_day: 35            # the most all of today's runs together can spend
  max_cycles_per_day: 8
  max_turns_per_cycle: 150
  max_consecutive_failures: 3    # then one diagnosis cycle, then the loop stops for you
  cycle_sleep_seconds: 60        # pause between cycles inside one run
  git_remote: origin

approvals:
  era_gates: false               # true = Builder stops and waits at each Era boundary
  pitch_requires_human: true     # Era III: you approve pitches until you set this false

network:
  # The only hosts firm agents may reach (through the App / metered keys).
  firm_egress_allowlist:
    - openrouter.ai
    - api.anthropic.com
    - query1.finance.yahoo.com
    - query2.finance.yahoo.com
