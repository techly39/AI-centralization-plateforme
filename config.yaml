# AI Fund Environment — single source of runtime configuration.
# Loaded by app/config.py via Pydantic Settings. Environment variables with the
# prefix FUND_ override any value here (e.g. FUND_DATABASE_URL=...).

# Database. SQLite single file for now; the URL form keeps a Postgres move open.
database_url: "sqlite:///fund.db"

# Clock. Phase 0 supports live mode only
clock:
  mode: "live"          # live

# Order management system.
oms:
  fee_rate: 0.001              # flat simulated fee, fraction of notional (0.1%)
  pending_check_minutes: 1     # how often pending limit orders are re-checked
  pending_monitor_enabled: true

# Market data. "yfinance" = real delayed quotes. Switch to "static" to run the
# whole app offline against the fixed prices listed under static_prices.
marketdata:
  provider: "yfinance"
  cache_ttl_seconds: 60        # reuse a quote while the clock moves less than this
  static_prices: {}            # e.g. {AAPL: 200.0, MSFT: 380.0}

# Logging.
logging:
  level: "INFO"
  json: true            # structured JSON logs (loguru)

# API server.
server:
  host: "127.0.0.1"
  port: 8000
