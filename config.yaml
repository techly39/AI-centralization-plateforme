# AI Fund Environment — single source of runtime configuration.
# Loaded by app/config.py via Pydantic Settings. Environment variables with the
# prefix FUND_ override any value here (e.g. FUND_DATABASE_URL=...).

# Database. SQLite single file for now; the URL form keeps a Postgres move open.
database_url: "sqlite:///fund.db"

# Clock. Not a setting: the mode is a fact of the database (ADR-027). A database
# whose ledger opens with run_started is a backtest run; any other is live.
# Open one with: FUND_DATABASE_URL=sqlite:///backtest.db uv run fund-env init-db
#                FUND_DATABASE_URL=sqlite:///backtest.db uv run fund-env start-backtest --start ...

# Order management system.
oms:
  fee_rate: 0.001              # flat simulated fee, fraction of notional (0.1%)
  pending_check_minutes: 1     # how often pending limit orders are re-checked
  pending_monitor_enabled: true

# Market data. "yfinance" = real delayed quotes. Switch to "static" to run the
# whole app offline against the fixed prices listed under static_prices.
marketdata:
  provider: "yfinance"
  cache_ttl_seconds: 60        # reuse a quote while the clock moves less than this
  static_prices: {}            # e.g. {AAPL: 200.0, MSFT: 380.0}
  # provider "synthetic": a keyed offline random walk, the same bars for the same key.
  # The key is secret (whoever holds it knows the future): set it only in the
  # environment, FUND_MARKETDATA__SYNTHETIC_KEY=<secrets.token_hex(32)>, never here.
  synthetic_symbols: {SYNA: 100.0, SYNB: 50.0, SYNC: 20.0}   # price on 2000-01-01

# Metrics. Only affects how performance is *reported* — never how it is earned.
metrics:
  risk_free_daily: 0.0         # subtracted from daily returns before the Sharpe ratio
  trading_days_per_year: 252   # used only to annualise the daily Sharpe

# Validation gates: what a pitched strategy must pass before it is eligible for capital
# (app/strategy/gates.py). Initial parameters, the firm's law; see the ADR on the pitch.
gates:
  holdout_days: 180            # the last days before today research may not see; pitches are judged on them
  research_max_days: 1095      # the longest window of one research backtest
  min_ic: 0.03                 # mean rank IC ...
  min_predictions: 300         # ... over at least this many predictions
  min_deflated_sharpe: 0.95    # P(true Sharpe > best of N luckless tries), N = the pod's attempts
  min_periods: 60              # fewer daily returns → the ratio is null, not a number
  impact_coefficient: 1.0      # square-root impact: cost = k σ sqrt(traded / daily dollar volume)
  capacity_edge_share: 0.5     # capacity = capital at which impact eats this share of the edge
  min_capacity_usd: 1000000    # a strategy must carry at least this much capital
  max_correlation: 0.5         # with any other pod's latest pitch, on the same days

# MCP server (mcp_server/). It is a CLIENT of the API above, in its own process.
# Leave api_key null here and pass it in the environment — this file is
# committed, and the key is the identity every action is attributed to:
#   FUND_MCP__API_KEY=<agent key> uv run fund-env-mcp
mcp:
  api_base_url: "http://127.0.0.1:8000"
  api_key: null
  timeout_seconds: 30

# Logging.
logging:
  level: "INFO"
  json: true            # structured JSON logs (loguru)

# API server.
server:
  host: "127.0.0.1"
  port: 8000
