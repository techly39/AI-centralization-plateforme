# AI Fund Environment — single source of runtime configuration.
# Loaded by app/config.py via Pydantic Settings. Environment variables with the
# prefix FUND_ override any value here (e.g. FUND_DATABASE_URL=...).

# Database. SQLite single file for now; the URL form keeps a Postgres move open.
database_url: "sqlite:///fund.db"

# Clock. Phase 0 supports live mode only
clock:
  mode: "live"          # live

# Order management system.
oms:
  fee_rate: 0.001              # flat simulated fee, fraction of notional (0.1%)
  pending_check_minutes: 1     # how often pending limit orders are re-checked
  pending_monitor_enabled: true

# Market data. "yfinance" = real delayed quotes. Switch to "static" to run the
# whole app offline against the fixed prices listed under static_prices.
marketdata:
  provider: "yfinance"
  cache_ttl_seconds: 60        # reuse a quote while the clock moves less than this
  static_prices: {}            # e.g. {AAPL: 200.0, MSFT: 380.0}

# Metrics. Only affects how performance is *reported* — never how it is earned.
metrics:
  risk_free_daily: 0.0         # subtracted from daily returns before the Sharpe ratio
  trading_days_per_year: 252   # used only to annualise the daily Sharpe

# MCP server (mcp_server/). It is a CLIENT of the API above, in its own process.
# Leave api_key null here and pass it in the environment — this file is
# committed, and the key is the identity every action is attributed to:
#   FUND_MCP__API_KEY=<agent key> uv run fund-env-mcp
mcp:
  api_base_url: "http://127.0.0.1:8000"
  api_key: null
  timeout_seconds: 30

# Human switches that physics reads and never writes. While the halt file
# exists, every agent write is refused with 423 (Constitution Art. 5).
# governance:
#   halt_file: "governance/HALT"   # default, resolved from the repo root

# Logging.
logging:
  level: "INFO"
  json: true            # structured JSON logs (loguru)

# API server.
server:
  host: "127.0.0.1"
  port: 8000
