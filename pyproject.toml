[project]
name = "fund-env"
version = "0.1.0"
description = "AI Fund Environment — the deterministic environment/bus for a simulated multi-agent hedge fund."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "yfinance>=0.2.40",
    "apscheduler>=3.10",
    "mcp>=2.0.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "anyio>=4.14.2",
]

# The `app` package lives at the repo root; expose it and the CLI.
[project.scripts]
fund-env = "app.cli:main"
# The MCP server is a separate process: it is a *client* of the API above.
fund-env-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
